input:
  # Relative paths are resolved from this config file's directory.
  # Use `base_dir` to point at the experiment folder that contains numbered subfolders (0, 1, 2, ...).
  # Pyrite example
  # base_dir: "/Volumes/Extreme SSD/deep-sea-particles-gm/raw/pyrite_2024-11-14 20-00-15.825503_good"

  # Plume particle example
  base_dir: "/Volumes/Extreme SSD/deep-sea-particles-gm/raw/plume_particle_6_20x_2024-11-14 18-09-41.970098"

  raw_root: "/Volumes/Extreme SSD/deep-sea-particles-gm/raw"
  processed_root: "/Volumes/Extreme SSD/deep-sea-particles-gm/processed"
  extensions:
    - ".tif"
    - ".bmp"
    - ".png"
slider:
  enabled: true
  window_name: "Select Start Frame ({folder})"
  trackbar_name: "Frame"
  start_index: 0
  instructions: "Move the slider for folder {folder}; press 's' to lock in the frame, 'x' to skip, or 'q'/Esc to end processing."
  font_scale: 1.1
threshold_slider:
  enabled: true
  window_name: "Threshold Tuning ({folder})"
  min: 0
  max: 255
  instructions: "Adjust threshold, press ENTER/SPACE to accept or 'c'/Esc to skip."
  font_scale: 1.0

tracker:
  # Default allowed trackers: CSRT (legacy) plus modern, efficient choices.
  type: "csrt"
  allowed_types:
    - "csrt"
    - "kcf"
    - "mosse"
  selection_window: "Select Tracking ROI"

crop:
  # select_roi_size: choose crop width/height interactively on first frame
  # fixed_size: use width/height below
  # tracker_box: crop size follows tracker bbox
  mode: "fixed_size"
  selection_window: "Select Crop ROI Size"
  width: 800
  height: 800

output:
  # When unspecified, the script creates "cropped" inside the experiment directory.
  crops_subdir: "cropped"
  rotation: "ccw"
  metadata_csv: "tracking_metadata.csv"
  summary_json: "frame_rate_summary.json"
  keep_source_stem: true
  save_extension: ".tif"
  save_color: true
  show_preview: true
  preview_window: "Tracking Preview"
